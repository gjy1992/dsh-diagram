version: "1.0"

# 性能与规模化用例：50 节点 / 45 连线 / 5 个服务域
# 每个服务域为 5 层两列的网格，域间只在末层横向互联
# 用于验证 PRD §6 的「<= 50 节点布局耗时 < 200ms」指标
#
# 注意：域间连线刻意只连「同一层的末节点」。若连到跨层的节点（例如把末层连回首域的中段），
# 最长路径分层会据此外推该节点的层号，整条并行链会被整体推移一层，肉眼看起来像"错位"——那是正确行为。

meta:
  title: 微服务群压力样例
  desc: 50 节点规模化布局验证
  summary: 5 个服务域，域内两路并行链路 + 域间横向互联
  guide: 域内自上而下，域间自左向右

